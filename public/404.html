<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weiterleitung – Bernd’s Blockhaus</title>
    <script>
      // Preserve the requested path and query for the React Router SPA.
      var base = '/bernds-blockhaus-website/';
      var path = window.location.pathname;
      var relative = path.startsWith(base) ? path.slice(base.length) : path.replace(/^\//, '');
      var target = base + '?/' + relative + window.location.search.replace(/^\?/, '&') + window.location.hash;
      sessionStorage.setItem('gh-pages-redirect', target);
      window.location.replace(target);
    </script>
  </head>
  <body>
    <p>Die gewünschte Seite wird geöffnet. <a href="/bernds-blockhaus-website/">Zur Startseite</a></p>
  </body>
</html>
